schema_version = 1
id = "comp1521-original-a"
version = "1.0.0"
title = "COMP1521-style Original Practice Paper A"
course = "COMP1521"
profile = "comp1521"
author = "CSEExamTTY project"
license = "CC BY-NC-ND 4.0"
paper = "paper/index.md"
reading_time_seconds = 600
working_time_seconds = 10800

[environment]
image = "csetty/comp1521:dev"
network = "none"
cpus = 2
memory_mb = 1024
pids = 128
output_limit_kb = 256

[[resources]]
path = "resources/mips-c-reference.md"
label = "C and MIPS quick reference"

[[questions]]
id = "final_q1"
title = "Rotate a 32-bit value right"
kind = "c_program"
prompt = "paper/questions/final_q1.md"
difficulty = 2
track = "normal"
tags = ["bitwise", "integer-representation", "c-revision"]
estimated_minutes = 12
points = 10
pass_points = 5
starter_files = ["starter/final_q1.c"]
submission_files = ["final_q1.c"]
[questions.build]
argv = ["dcc", "-Werror", "final_q1.c", "-o", "final_q1"]
[[questions.test_groups]]
id = "public"
visibility = "public"
points = 5
[[questions.test_groups.tests]]
id = "one-bit"
argv = ["./final_q1", "1", "1"]
expected_stdout = "2147483648\n"
expected_stderr = ""
expected_exit = 0
[[questions.test_groups]]
id = "marking"
visibility = "after_finish"
points = 5
[[questions.test_groups.tests]]
id = "one-byte"
argv = ["./final_q1", "305419896", "8"]
expected_stdout = "2014458966\n"
expected_stderr = ""
expected_exit = 0

