schema_version = 1
id = "comp1511-original-a"
version = "1.0.0"
title = "COMP1511-style Original Practice Paper A"
course = "COMP1511"
profile = "comp1511"
author = "CSEExamTTY project"
license = "CC BY-NC-ND 4.0"
paper = "paper/index.md"
reading_time_seconds = 600
working_time_seconds = 10800

[environment]
image = "csetty/comp1511:dev"
network = "none"
cpus = 2
memory_mb = 1024
pids = 128
output_limit_kb = 256

[[resources]]
path = "resources/c-reference.md"
label = "C quick reference"

[[questions]]
id = "prac_q1"
title = "Count sign changes in a linked list"
kind = "c_program"
prompt = "paper/questions/prac_q1.md"
difficulty = 3
track = "normal"
tags = ["linked-lists", "functions", "hurdle"]
estimated_minutes = 20
points = 12
pass_points = 6
starter_files = ["starter/prac_q1.c"]
submission_files = ["prac_q1.c"]
[questions.build]
argv = ["dcc", "-Werror", "prac_q1.c", "-o", "prac_q1"]
[[questions.test_groups]]
id = "public"
visibility = "public"
points = 6
[[questions.test_groups.tests]]
id = "mixed"
argv = ["./prac_q1", "1", "-2", "-3", "4"]
expected_stdout = "2\n"
expected_stderr = ""
expected_exit = 0
[[questions.test_groups]]
id = "marking"
visibility = "after_finish"
points = 6
[[questions.test_groups.tests]]
id = "zeros"
argv = ["./prac_q1", "-1", "2", "0", "-4", "5"]
expected_stdout = "2\n"
expected_stderr = ""
expected_exit = 0

